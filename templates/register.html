<!DOCTYPE html>
<html>
<head>
    <title>Online Voting System - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>REGISTER</h1>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    {% if registration_open %}
    <p class="note">Register once using your roll number. You will use this password to log in and vote later.</p>

    <form method="POST" action="/register">
        <label>Roll No:</label>
        <input type="text" name="roll_no">
        <br><br>
        <label>Create Password:</label>
        <input type="password" name="password">
        <br><br>
        <button type="submit">Register</button>
    </form>
    {% endif %}

    <p class="note">Already registered? <a href="/login">Login here</a> | <a href="/results">View results</a> | <a href="/">Home</a></p>

</body>
</html>
